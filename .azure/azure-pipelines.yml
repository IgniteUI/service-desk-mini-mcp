name: Azure CI

trigger:
  branches:
    include: [ main ]

pr:
  branches:
    include: [ main ]

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
  - script: dotnet restore
    displayName: 'Restore dependencies'
  - script: dotnet build --no-restore
    displayName: 'Build'
